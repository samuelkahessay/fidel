name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: swift-format
        run: xcrun swift-format lint --strict --recursive Fidel FidelTests
      - name: SwiftLint
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint lint --strict --baseline .swiftlint-baseline.json

  test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and test (unsigned)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Fidel.xcodeproj \
            -scheme Fidel \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= \
            | tee xcodebuild.log
      - name: Fail on build warnings
        run: |
          if grep -E '^/.*: warning: ' xcodebuild.log | grep -v '/Packages/SyncKit/' ; then
            echo "::error::The build produced warnings"; exit 1
          fi
